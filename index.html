<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <title></title>
    <link rel="icon" href="" type="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/js_class.css">
</head>
<body>
<div class="container d-flex align-items-center flex-column">

<img src="imgs/logo-be01d065.png" alt="logo" class="my-5">

<form id="register" method="post" class="d-flex flex-column align-items-center">

<h1>Students System</h1>


<div class="input-group mb-3">
  <span class="input-group-text" id="basic-addon1"><i class="fa-solid fa-user"></i></span>
  <input type="text" class="form-control" placeholder="First Name *" name="firstName" onblur="checkinput(this)">
</div>

<div class="w-100 alert alert-warning justify-content-center align-items-center d-none" role="alert" data-error-name="firstName">
  Invalid Field
</div>


<div class="input-group mb-3">
  <span class="input-group-text" id="basic-addon2"><i class="fa-solid fa-user-group"></i></span>
  <input type="text" class="form-control" placeholder="Second Name *" name="secondName" onblur="checkinput(this)">
</div>

<div class="w-100 alert alert-warning justify-content-center align-items-center d-none" role="alert" data-error-name="secondName">
  Invalid Field
</div>


<div class="input-group mb-3">
  <span class="input-group-text" id="basic-addon3"><i class="fa-solid fa-envelope"></i></span>
  <input type="email" class="form-control" placeholder="Email *" name="email" onblur="checkinput(this)">
</div>

<div class="w-100 alert alert-warning justify-content-center align-items-center d-none" role="alert" data-error-name="email">
  Invalid Field
</div>


<div class="input-group mb-3">
  <span class="input-group-text" id="basic-addon4"><i class="fa-regular fa-calendar"></i></span>
  <input type="number" class="form-control" placeholder="Age *" name="age" onblur="checkinput(this)">
</div>

<div class="w-100 alert alert-warning justify-content-center align-items-center d-none" role="alert" data-error-name="age">
  Invalid Field
</div>


<div class="input-group mb-3">
  <span class="input-group-text" id="basic-addon5"><i class="fa-solid fa-phone"></i></span>
  <input type="tel" class="form-control" placeholder="Phone Number *" name="phone" onblur="checkinput(this)">
</div>

<div class="w-100 alert alert-warning justify-content-center align-items-center d-none" role="alert" data-error-name="phone">
  Invalid Field
</div>

<button type="submit" class="btn btn-success w-100 mb-3" onclick="location.reload()">
    Add
</button>


</form>

<form method="get" class="d-flex flex-column align-items-center mb-5 mt-5">

<div class="input-group mb-3 mt-3">
  <span class="input-group-text" id="basic-addon1"><i class="fa-solid fa-magnifying-glass"></i></span>
  <input type="text" class="form-control" placeholder="Search..." name="Search">
</div>

<button type="button" class="btn btn-dark m-4" onclick="location.reload()">
    back
</button>

</form>

<div class="table table-responsive rounded">
<table class="table table-striped text-nowrap">
  <thead class="table-dark">
    <tr>
      <th scope="col">#</th>
      <th scope="col">First Name</th>
      <th scope="col">Last Name</th>
      <th scope="col">Email</th>
      <th scope="col">Age</th>
      <th scope="col">Phone</th>
      <th scope="col">Options</th>
    </tr>
  </thead>
  <tbody>
  </tbody>
</table>
</div>

<div class="alert alert-danger w-100 d-flex justify-content-center align-items-center" role="alert">
  مفيش داتا يا صاحبي :(
</div>




</div>
<script src="js/functions.js"></script>    
<script src="js/index.js"></script>    
</body>
</html>
